services:
  database:
    image: mysql:9.6
    environment:
      MYSQL_DATABASE: transaction
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env (veja .env.example)}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no .env (veja .env.example)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env (veja .env.example)}
    ports:
      - "3307:3306"
    volumes:
      - transaction_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 5

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.34.0
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      # Read-only: the API has no CORS, so "Try it out" would not work from the browser
      SUPPORTED_SUBMIT_METHODS: "[]"
    ports:
      - "8081:8080"
    volumes:
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro

volumes:
  transaction_data:
