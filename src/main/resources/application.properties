# Application
spring.application.name=budgeting

# Logging
logging.structured.format.console=ecs

# Observability
management.otlp.metrics.export.enabled=false

# Web: error messages are pt-BR regardless of Accept-Language
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Upload: a voice command lasts a few seconds (about 40 s of M4A at 206 kbps fits in 1 MB) and the request carries only
# the file, so both limits are explicit; an upload above them is a 413 about:blank
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Errors: Retry-After sent with 503 when the AI provider is unavailable
budgeting.errors.assistant-unavailable-retry-after=30s

# Security: secret of the HS256 tokens (at least 32 bytes), required to start
budgeting.security.jwt.secret=${JWT_SECRET}

# Persistence: pool wait, TCP connect and per-query response each have a cap
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=5000

# AI: observability, content never goes to logs
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
spring.ai.audio.transcription.observations.log-transcript=false
spring.ai.audio.speech.observations.log-text=false
spring.ai.tools.observations.include-content=false

# AI: the WARN for a tool argument conversion failure carries the rejected value in the stack trace
logging.level.org.springframework.ai.tool.method.MethodToolCallback=ERROR

# AI: timeout and retry are per stage and per HTTP request, never the global spring.ai.openai.* keys. The SDK backs off
# exponentially (0.5 s to 8 s) with jitter, so one request costs at most 2 x timeout + 8 s. Worst case by construction,
# about 128 s: transcription 2 x 10 + 8 = 28 s; chat 2 x (2 x 12 + 8) = 64 s (two requests when a tool is called);
# speech 28 s; database tool 3 + 5 = 8 s. The SDK retries only the failed request, so a write tool never runs twice
# AI: chat
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.timeout=12s
spring.ai.openai.chat.max-retries=1
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.response-format.type=TEXT

# AI: transcription
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.timeout=10s
spring.ai.openai.audio.transcription.max-retries=1
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro.\
  Áudio contém descrição de gastos financeiros. \
  As frases geralmente contêm: \
   - um valor em reais (número + "reais"); \
   - uma ação (gastei, paguei, comprei); \
   - um local ou estabelecimento (mercado, farmácia, restaurante, loja, etc.).

# AI: speech
spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.timeout=10s
spring.ai.openai.audio.speech.max-retries=1
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=nova
spring.ai.openai.audio.speech.options.speed=1.2
spring.ai.openai.audio.speech.options.response-format=mp3
