# Application
spring.application.name=budgeting

# Logging
logging.structured.format.console=ecs

# Observability: only health and metrics are exposed; the metrics feed the business counter and the technical ones
# (AI latency, HTTP errors, resources) read at /actuator/metrics
management.endpoints.web.exposure.include=health,metrics
# Metrics go to the OTLP collector of the compose.yml (Grafana), found by spring-boot-docker-compose
management.otlp.metrics.export.enabled=true
# Export interval: a new value takes up to this long to show in Grafana
management.otlp.metrics.export.step=1m

# Web: error messages are pt-BR regardless of Accept-Language
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Upload: a voice command lasts a few seconds (about 40 s of M4A at 206 kbps fits in 1 MB) and the request carries only
# the file, so both limits are explicit; an upload above them is a 413 about:blank
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Threads: requests, @Async and @Scheduled run on virtual threads (Java 25 has no pinning on synchronized); the real
# limit to the database stays the Hikari pool
spring.threads.virtual.enabled=true
# Async: the task decorator copies the tracing context to the async thread, so the audit entry keeps the traceId
spring.task.execution.propagate-context=true

# Errors: Retry-After sent with 503 when the AI provider is unavailable
budgeting.errors.assistant-unavailable-retry-after=30s

# Transaction proposals: valid for the time to live (the confirmation comes right after the spoken answer; later it is
# out of context). The sweep deletes the expired ones in batches, each in its own transaction; the interval counts
# from the end of the previous run
budgeting.transaction-proposals.time-to-live=5m
budgeting.transaction-proposals.expiration-sweep-interval=1m
budgeting.transaction-proposals.expiration-batch-size=1000
budgeting.transaction-proposals.expiration-sweep-enabled=true

# Security: secret of the HS256 tokens (at least 32 bytes), required to start
budgeting.security.jwt.secret=${JWT_SECRET}

# Persistence: pool wait, TCP connect and per-query response each have a cap
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=5000

# Audit: MongoDB stores UUIDs in the standard BSON format. The driver waits 30 s for server selection and has no read
# limit, so each one is capped (see MongoConfiguration); there is no URI: local comes from spring-boot-docker-compose,
# elsewhere from SPRING_MONGODB_URI
spring.mongodb.representation.uuid=standard
budgeting.audit.connect-timeout=3s
budgeting.audit.server-selection-timeout=3s
budgeting.audit.read-timeout=5s
# Resubmission: a job hands the FAILED publications back to the listener, in batches. The minimum age (well above the
# worst delivery, 3 s + 5 s) keeps it from resubmitting a delivery that is still running
budgeting.audit.resubmission-interval=1m
budgeting.audit.resubmission-min-age=1m
budgeting.audit.resubmission-batch-size=100
budgeting.audit.resubmission-enabled=true

# Event publication registry (outbox): Modulith creates its own table with its official schema; a completed publication
# is deleted, because it carries the serialized transcription and should not stay in MySQL
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.completion-mode=DELETE
# A publication stuck in a state (the application went down mid-delivery) becomes FAILED after the limit and then
# enters the resubmission; the check runs at the same pace, so the recovery delay is at most about twice the limit
spring.modulith.events.staleness.published=1m
spring.modulith.events.staleness.processing=1m
spring.modulith.events.staleness.resubmitted=1m
spring.modulith.events.staleness.check-interval=1m
# The Modulith logs a failed delivery at INFO with the exception message, which can carry business data; our WARN in
# DomainEventAuditListener (event and error types only) is the record of the failure
logging.level.org.springframework.modulith.events.support.CompletionRegisteringAdvisor=WARN

# AI: observability, content never goes to logs
spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
spring.ai.audio.transcription.observations.log-transcript=false
spring.ai.audio.speech.observations.log-text=false
spring.ai.tools.observations.include-content=false

# AI: the WARN for a tool argument conversion failure carries the rejected value in the stack trace
logging.level.org.springframework.ai.tool.method.MethodToolCallback=ERROR

# AI: timeout and retry are per stage and per HTTP request, never the global spring.ai.openai.* keys. The SDK backs off
# exponentially (0.5 s to 8 s) with jitter, so one request costs at most 2 x timeout + 8 s. Worst case by construction,
# about 96 s: transcription 2 x 10 + 8 = 28 s; chat 2 x 12 + 8 = 32 s (one request: a tool ends the call);
# speech 28 s; database tool 3 + 5 = 8 s. The SDK retries only the failed request, so a write tool never runs twice
# AI: chat
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.timeout=12s
spring.ai.openai.chat.max-retries=1
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.response-format.type=TEXT
# At most one tool per command, and a cap on the text the model writes, which is discarded: the application speaks
spring.ai.openai.chat.options.parallel-tool-calls=false
spring.ai.openai.chat.options.max-completion-tokens=500

# AI: transcription
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.timeout=10s
spring.ai.openai.audio.transcription.max-retries=1
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
# verbose_json is the only format in which whisper-1 returns the audio duration
spring.ai.openai.audio.transcription.options.response-format=verbose_json
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro.\
  Áudio contém descrição de gastos financeiros. \
  As frases geralmente contêm: \
   - um valor em reais (número + "reais"); \
   - uma ação (gastei, paguei, comprei); \
   - um local ou estabelecimento (mercado, farmácia, restaurante, loja, etc.).

# AI: speech
spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.timeout=10s
spring.ai.openai.audio.speech.max-retries=1
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=nova
spring.ai.openai.audio.speech.options.speed=1.2
spring.ai.openai.audio.speech.options.response-format=mp3

# Local speech cache (Caffeine, per instance). The cache is created at startup so it shows up in the metrics and a wrong
# name in @Cacheable fails fast. maximumSize bounds the heap (tens of KB per audio); expireAfterWrite bounds how long a
# proposal sentence (dictated description and amount) stays in memory; recordStats feeds cache.gets/size/evictions.
spring.cache.type=caffeine
spring.cache.cache-names=speech
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=1h,recordStats
