# Nonexistent provider: an integration test that reaches the AI without a stub fails fast instead of calling a real one
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:1
spring.ai.openai.audio.transcription.max-retries=0
spring.ai.openai.chat.max-retries=0
spring.ai.openai.audio.speech.max-retries=0
budgeting.security.jwt.secret=test-jwt-secret-with-at-least-32-bytes
# The sweep would delete proposals in the middle of another test
budgeting.transaction-proposals.expiration-sweep-enabled=false
# The resubmission would redeliver publications in the middle of another test
budgeting.audit.resubmission-enabled=false
# There is no OTLP collector in the tests: the final export when each context closes would fail with a stack trace in the log
management.otlp.metrics.export.enabled=false
# Rate limiting must not influence any test: RateLimitIT turns it on in its own class
budgeting.rate-limit.enabled=false
# Resilience must not influence any test: without the auto-configurations the annotations are inert. Tests that need it opt in with @EnableResilience
spring.autoconfigure.exclude=\
  io.github.resilience4j.springboot.bulkhead.autoconfigure.BulkheadRefreshScopedRegistryAutoConfiguration,\
  io.github.resilience4j.springboot.bulkhead.autoconfigure.BulkheadAutoConfiguration,\
  io.github.resilience4j.springboot.bulkhead.autoconfigure.BulkheadMetricsAutoConfiguration,\
  io.github.resilience4j.springboot.bulkhead.autoconfigure.ThreadPoolBulkheadMetricsAutoConfiguration,\
  io.github.resilience4j.springboot.circuitbreaker.autoconfigure.CircuitBreakerRefreshScopedRegistryAutoConfiguration,\
  io.github.resilience4j.springboot.circuitbreaker.autoconfigure.CircuitBreakerAutoConfiguration,\
  io.github.resilience4j.springboot.circuitbreaker.autoconfigure.CircuitBreakerMetricsAutoConfiguration,\
  io.github.resilience4j.springboot.circuitbreaker.autoconfigure.CircuitBreakerStreamEventsAutoConfiguration,\
  io.github.resilience4j.springboot.circuitbreaker.autoconfigure.CircuitBreakersHealthIndicatorAutoConfiguration,\
  io.github.resilience4j.springboot.micrometer.autoconfigure.TimerAutoConfiguration,\
  io.github.resilience4j.springboot.ratelimiter.autoconfigure.RateLimiterRefreshScopedRegistryAutoConfiguration,\
  io.github.resilience4j.springboot.ratelimiter.autoconfigure.RateLimiterAutoConfiguration,\
  io.github.resilience4j.springboot.ratelimiter.autoconfigure.RateLimiterMetricsAutoConfiguration,\
  io.github.resilience4j.springboot.ratelimiter.autoconfigure.RateLimitersHealthIndicatorAutoConfiguration,\
  io.github.resilience4j.springboot.retry.autoconfigure.RetryAutoConfiguration,\
  io.github.resilience4j.springboot.retry.autoconfigure.RetryMetricsAutoConfiguration,\
  io.github.resilience4j.springboot.retry.autoconfigure.RetryRefreshScopedRegistryAutoConfiguration,\
  io.github.resilience4j.springboot.scheduled.threadpool.autoconfigure.ContextAwareScheduledThreadPoolAutoConfiguration,\
  io.github.resilience4j.springboot.timelimiter.autoconfigure.TimeLimiterRefreshScopedRegistryAutoConfiguration,\
  io.github.resilience4j.springboot.timelimiter.autoconfigure.TimeLimiterAutoConfiguration,\
  io.github.resilience4j.springboot.timelimiter.autoconfigure.TimeLimiterMetricsAutoConfiguration,\
  io.github.resilience4j.springboot.verifier.autoconfigure.SpringBoot4VerifierAutoConfiguration
