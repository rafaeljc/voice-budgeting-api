# Nonexistent provider: an integration test that reaches the AI without a stub fails fast instead of calling a real one
spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=http://localhost:1
spring.ai.openai.audio.transcription.max-retries=0
spring.ai.openai.chat.max-retries=0
spring.ai.openai.audio.speech.max-retries=0
budgeting.security.jwt.secret=test-jwt-secret-with-at-least-32-bytes
# The sweep would delete proposals in the middle of another test
budgeting.transaction-proposals.expiration-sweep-enabled=false
# The resubmission would redeliver publications in the middle of another test
budgeting.audit.resubmission-enabled=false
# There is no OTLP collector in the tests: the final export when each context closes would fail with a stack trace in the log
management.otlp.metrics.export.enabled=false
