openapi: 3.0.1
info:
  title: Budgeting API
  description: API de orçamento por voz.
  version: v1
servers:
- url: http://localhost
tags: []
paths:
  /api/v1/transactions:
    get:
      tags:
      - Transações
      summary: Lista as transações
      description: "Lista as transações de forma paginada, da mais recente para a\
        \ mais antiga."
      operationId: list-transactions
      parameters:
      - name: category
        in: query
        description: Filtra pela categoria da transação.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: "Número da página, a partir de 0; padrão 0."
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "Itens por página, de 1 a 100; padrão 20."
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "Ordenação no formato `campo,direção`, com campo `createdAt`\
          \ ou `amount` e direção `asc` ou `desc`; padrão `createdAt,desc`."
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-transactions1106890157"
              examples:
                list-transactions:
                  value: "{\"content\":[{\"id\":\"6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f\"\
                    ,\"category\":\"GROCERIES\",\"description\":\"Padaria\",\"amount\"\
                    :\"10.00\",\"currency\":\"BRL\",\"createdAt\":\"2026-01-15T10:30:00.000Z\"\
                    },{\"id\":\"6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f\",\"category\"\
                    :\"GROCERIES\",\"description\":\"Feira\",\"amount\":\"10.00\"\
                    ,\"currency\":\"BRL\",\"createdAt\":\"2026-01-15T10:30:00.000Z\"\
                    },{\"id\":\"6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f\",\"category\"\
                    :\"GROCERIES\",\"description\":\"Mercado\",\"amount\":\"10.00\"\
                    ,\"currency\":\"BRL\",\"createdAt\":\"2026-01-15T10:30:00.000Z\"\
                    }],\"page\":{\"size\":20,\"number\":0,\"totalElements\":3,\"totalPages\"\
                    :1}}"
        "400":
          description: "400"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api-v1-transactions1600859056"
              examples:
                list-transactions-invalid-parameter:
                  value: "{\"detail\":\"Um ou mais campos são inválidos.\",\"instance\"\
                    :\"/api/v1/transactions\",\"status\":400,\"title\":\"Dados invá\
                    lidos\",\"type\":\"urn:problem-type:budgeting:validation-error\"\
                    ,\"errors\":[{\"parameter\":\"size\",\"detail\":\"Valor inválido.\"\
                    }]}"
    post:
      tags:
      - Transações
      summary: Cria uma transação
      description: Registra uma transação financeira e devolve o recurso criado.
      operationId: create-transaction
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/api-v1-transactions230587816"
            examples:
              create-transaction:
                value: |
                  {"description": "Mercado", "category": "GROCERIES", "amount": "80.00", "currency": "BRL"}
      responses:
        "201":
          description: "201"
          headers:
            Location:
              description: URL absoluta da transação criada.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-transactions-1221895240"
              examples:
                create-transaction:
                  value: "{\"id\":\"6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f\",\"category\"\
                    :\"GROCERIES\",\"description\":\"Mercado\",\"amount\":\"80.00\"\
                    ,\"currency\":\"BRL\",\"createdAt\":\"2026-01-15T10:30:00.000Z\"\
                    }"
  /api/v1/transactions/{id}:
    get:
      tags:
      - Transações
      summary: Consulta uma transação
      description: Devolve a transação com o identificador informado.
      operationId: get-transaction
      parameters:
      - name: id
        in: path
        description: Identificador da transação.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-transactions-1221895240"
              examples:
                get-transaction:
                  value: "{\"id\":\"6f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f\",\"category\"\
                    :\"GROCERIES\",\"description\":\"Mercado\",\"amount\":\"80.00\"\
                    ,\"currency\":\"BRL\",\"createdAt\":\"2026-01-15T10:30:00.000Z\"\
                    }"
        "404":
          description: "404"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/api-v1-transactions-id-1312430295"
              examples:
                get-transaction-not-found:
                  value: "{\"detail\":\"A transação solicitada não existe.\",\"instance\"\
                    :\"/api/v1/transactions/{id}\",\"status\":404,\"title\":\"Transaç\
                    ão não encontrada\",\"type\":\"urn:problem-type:budgeting:transaction-not-found\"\
                    }"
components:
  schemas:
    api-v1-transactions1106890157:
      required:
      - content
      - page
      type: object
      properties:
        page:
          required:
          - number
          - size
          - totalElements
          - totalPages
          type: object
          properties:
            number:
              type: number
              description: "Número da página, a partir de 0."
            size:
              type: number
              description: Itens por página aplicado.
            totalPages:
              type: number
              description: Total de páginas.
            totalElements:
              type: number
              description: Total de transações que atendem ao filtro.
          description: Metadados da paginação.
        content:
          type: array
          description: Transações da página.
          items:
            required:
            - amount
            - category
            - createdAt
            - currency
            - description
            - id
            type: object
            properties:
              createdAt:
                type: string
                description: "Data e hora do registro, em UTC (ISO 8601)."
              amount:
                type: string
                description: "Valor, em texto, com duas casas decimais."
              description:
                type: string
                description: Descrição da transação.
              currency:
                type: string
                description: Moeda da transação.
              id:
                type: string
                description: Identificador da transação.
              category:
                type: string
                description: Categoria da transação.
    api-v1-transactions1600859056:
      required:
      - detail
      - errors
      - instance
      - status
      - title
      - type
      type: object
      properties:
        instance:
          type: string
          description: Caminho da requisição.
        detail:
          type: string
          description: Explicação do problema.
        title:
          type: string
          description: Resumo do problema.
        type:
          type: string
          description: Tipo do problema.
        errors:
          type: array
          description: Parâmetros inválidos.
          items:
            required:
            - detail
            - parameter
            type: object
            properties:
              parameter:
                type: string
                description: Nome do parâmetro de consulta inválido.
              detail:
                type: string
                description: Motivo pelo qual o parâmetro é inválido.
        status:
          type: number
          description: Status HTTP.
    api-v1-transactions230587816:
      required:
      - amount
      - category
      - currency
      - description
      type: object
      properties:
        amount:
          type: string
          description: "Valor positivo, em texto, com duas casas decimais."
        description:
          type: string
          description: "Descrição da transação, até 255 caracteres."
        currency:
          type: string
          description: Moeda; apenas `BRL`.
        category:
          type: string
          description: Categoria da transação.
    api-v1-transactions-1221895240:
      required:
      - amount
      - category
      - createdAt
      - currency
      - description
      - id
      type: object
      properties:
        createdAt:
          type: string
          description: "Data e hora do registro, em UTC (ISO 8601)."
        amount:
          type: string
          description: "Valor, em texto, com duas casas decimais."
        description:
          type: string
          description: Descrição da transação.
        currency:
          type: string
          description: Moeda da transação.
        id:
          type: string
          description: Identificador da transação.
        category:
          type: string
          description: Categoria da transação.
    api-v1-transactions-id-1312430295:
      required:
      - detail
      - instance
      - status
      - title
      - type
      type: object
      properties:
        instance:
          type: string
          description: Caminho da requisição.
        detail:
          type: string
          description: Explicação do problema.
        title:
          type: string
          description: Resumo do problema.
        type:
          type: string
          description: Tipo do problema.
        status:
          type: number
          description: Status HTTP.
